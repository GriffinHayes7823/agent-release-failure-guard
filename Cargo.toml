[package]
name = "agent-release-failure-guard"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Block releases on failed AI-agent build steps and record actionable diagnostics"

[dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }

